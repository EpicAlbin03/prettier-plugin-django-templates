name: Release

on:
  push:
    branches:
      - main

concurrency:
  # prevent two release workflows from running at once
  # race conditions here can result in releases failing
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}
jobs:
  release:
    # prevents this action from running on forks
    if: github.repository == 'EpicAlbin03/prettier-plugin-django-templates'
    permissions:
      contents: write # to create release (changesets/action)
      id-token: write # OpenID Connect token needed for provenance
      pull-requests: write # to create pull request (changesets/action)
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
          fetch-depth: 0
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version: 22.x
          cache: true
      - name: Install
        run: vp install --frozen-lockfile
      - name: Validate release
        run: vp run validate:release
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: vp run changeset:version
          publish-script: vp run changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
