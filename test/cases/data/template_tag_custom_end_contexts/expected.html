{% endpoint %}
{% endless "items" limit=3 %}
{% endpoint item.slug %}


{% panel %}
  <section>
    {% row %}
      <span>{{ value }}</span>
    {% endrow %}
  </section>
{% endpanel %}


{% div_custom_end %}
  <div>{{ value }}</div>
{% divend %}
{% dnd_area "main" %}
  {% dnd_section %}
    <p>{{ copy }}</p>
  {% end_dnd_section %}
{% end_dnd_area %}

<div
  {% attribute_group %}data-first="one" data-second="two"{% endattribute_group %}
  class="{% tone %}primary{% endtone %}"
>
  {{ value }}
</div>
